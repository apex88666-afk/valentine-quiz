<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do You Really Know Me? 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg1:#ffe6f0;
  --bg2:#ffd6eb;
  --pink:#ff4ca2;
  --pink2:#ff2f92;
  --text:#7a2a55;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(145deg,var(--bg1),var(--bg2));
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  color:var(--text);
}

/* Floating hearts */
.floating{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}
.heart{
  position:absolute;
  bottom:-30px;
  animation:float 8s linear infinite;
  opacity:.6;
}
@keyframes float{
  0%{transform:translateY(0);opacity:0}
  10%{opacity:.7}
  100%{transform:translateY(-110vh);opacity:0}
}

/* Card */
.card{
  background:white;
  width:95%;
  max-width:700px;
  border-radius:25px;
  padding:25px;
  box-shadow:0 20px 40px rgba(255,0,120,.2);
  z-index:2;
  position:relative;
}

h1,h2{text-align:center;margin-bottom:15px}

button{
  background:linear-gradient(145deg,var(--pink),var(--pink2));
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:30px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
  margin-top:10px;
}
button:hover{transform:scale(1.05)}

.hidden{display:none}

/* Options */
.options{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:15px;
}
.option{
  background:#fff;
  border:2px solid #ffd3e8;
  border-radius:15px;
  padding:10px;
  cursor:pointer;
  transition:.3s;
}
.option:hover{background:#ffeaf4}

/* Meter */
.meter{
  margin-bottom:20px;
}
.bar{
  height:10px;
  background:#ffeaf4;
  border-radius:20px;
  overflow:hidden;
}
.fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--pink),var(--pink2));
  transition:.4s;
}
#hearts{text-align:center;margin-top:5px}

/* Big heart animation */
.big-heart{
  font-size:5rem;
  text-align:center;
  animation:pulse 1.2s infinite;
}
@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.2)}
}

/* Confetti canvas */
canvas{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:5;
}



#videoOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:100;
  opacity:0;
  pointer-events:none;
  transition:opacity 1s ease;
}

#videoOverlay.show{
  opacity:1;
  pointer-events:auto;
}

#videoOverlay video{
  width:90%;
  max-width:800px;
  max-height:85vh;
  border-radius:20px;
  box-shadow:0 20px 60px rgba(255,0,120,.5);
}



</style>
</head>

<body>

<canvas id="confetti"></canvas>
<div class="floating" id="floating"></div>

<div class="card">

<div id="landing">
<h1>Do You Really Know Me? 💖</h1>
<p style="text-align:center;">A tiny love test with big romantic consequences ✨</p>
<div style="text-align:center;">
<button onclick="startQuiz()">Start the Love Test</button>
</div>
</div>

<div id="quiz" class="hidden">
<div class="meter">
<div style="display:flex;justify-content:space-between">
<b>Love Meter</b>
<span id="scoreText">0/16</span>
</div>
<div class="bar"><div class="fill" id="fill"></div></div>
<div id="hearts">🤍🤍🤍🤍🤍 (0/5)</div>
</div>

<h2 id="question"></h2>
<div class="options" id="options"></div>
<div id="feedback" style="text-align:center;font-weight:600;margin-top:10px;"></div>
</div>

<div id="result" class="hidden">
<h2 id="resultTitle"></h2>
<div class="big-heart">💖</div>
<div style="text-align:center;">
<button id="finalBtn"></button>
</div>
<p id="finalMessage" style="text-align:center;margin-top:15px;font-weight:700;"></p>
<div id="finalVideoContainer" style="display:none; margin-top:20px; text-align:center;">
  <video id="finalVideo" width="100%" style="max-width:500px; border-radius:20px; box-shadow:0 10px 30px rgba(255,0,120,.3);" muted playsinline>
    <source src="cute.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>

</div>

</div>

<script>

/* QUESTIONS */
const questions=[
{q:"What’s my favorite thing about you?",o:["Eyes","Smile","Hair","Nose"],a:["Eyes"]},
{q:"What nickname do I love calling you?",o:["Baby","Babe","Pookie","Kutty ma"],a:["Baby"]},
{q:"What’s something you do that instantly makes me smile?",o:["Your smile","Puppy eyes","When you're angry","Eating"],a:["Puppy eyes"]},
{q:"What’s one thing I always say to you?",o:["I love you so much baby","Monkey","Demon","Good girl"],a:["I love you so much baby"]},
{q:"If we could travel anywhere, where would I take you?",o:["Disney Land","Dubai","Kerala","Paris"],a:["Disney Land"]},
{q:"What song reminds me of you the most?",o:["Sweater Weather","No Pole","Pillowtalk","No Lie"],a:["Sweater Weather"]},
{q:"What’s my comfort food?",o:["Sushi","Burger","Pizza","Biriyani"],a:["Pizza"]},
{q:"Who says 'I love you' more?",o:["Me","Baby","Both","No one"],a:["Baby"]},
{q:"What future do I imagine with you?",o:["A boring one","An adventurous one","A sad one","Just living"],a:["An adventurous one"]},
{q:"What’s our go-to hangout place?",o:["Mall of Asia","Church Street","Koramangala","Indranagar"],a:["Mall of Asia"]},
{q:"What’s our favorite thing to do together?",o:["Cuddle","Sing","Everything","Dance"],a:["Everything"]},
{q:"Where did we go for our first date?",o:["Truffles","Muro","Koriken","Legacy"],a:["Truffles"]},
{q:"How did I ask you to be my girlfriend?",o:["A cute video","A calculator","With a ring","Didn’t ask"],a:["A calculator"]},
{q:"Who loves me the most?",o:["Baby","Baby","Baby","Baby"],a:["Baby"]},
{q:"Clingy Level Question",type:"slider"},
{q:"Will you be my Valentine forever? 💍💕",o:["YES","Obviously YES","There was never another option"],a:["YES","Obviously YES","There was never another option"]}
];

let index=0,score=0;

function startQuiz(){
document.getElementById("landing").classList.add("hidden");
document.getElementById("quiz").classList.remove("hidden");
render();
}

function render(){
if(index>=questions.length){showResult();return;}
const q=questions[index];
document.getElementById("question").innerText=q.q;
const optionsDiv=document.getElementById("options");
optionsDiv.innerHTML="";
document.getElementById("feedback").innerText="";

if(q.type==="slider"){
optionsDiv.innerHTML=`
<input type="range" min="1" max="10" value="5" id="slider">
<div style="text-align:center;margin-top:5px">Level: <span id="val">5</span></div>
<div style="text-align:center"><button onclick="checkSlider()">Submit</button></div>
`;
document.getElementById("slider").oninput=e=>document.getElementById("val").innerText=e.target.value;
return;
}

q.o.forEach(opt=>{
const div=document.createElement("div");
div.className="option";
div.innerText=opt;
div.onclick=()=>checkAnswer(opt,q);
optionsDiv.appendChild(div);
});
}

function checkSlider(){
const v=document.getElementById("slider").value;
if(v==10){
score++;
celebrate();
document.getElementById("feedback").innerText="Correct. I’m OBSESSED with you 😌💖";
setTimeout(()=>{index++;update();render();},800);
}else{
document.getElementById("feedback").innerText="Higher. Try again 😏";
}
}

function checkAnswer(opt,q){
if(q.a.includes(opt)){
score++;
celebrate();
document.getElementById("feedback").innerText="Correct my love 💕";
}else{
document.getElementById("feedback").innerText="Aww close one 💗";
}
setTimeout(()=>{index++;update();render();},700);
}

function update(){
document.getElementById("scoreText").innerText=score+"/"+questions.length;
document.getElementById("fill").style.width=(score/questions.length*100)+"%";
let hearts=Math.round(score/questions.length*5);
document.getElementById("hearts").innerText="❤️".repeat(hearts)+"🤍".repeat(5-hearts)+" ("+score+"/16)";
}
function showResult(){
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  if(score/questions.length >= 0.8){

    document.getElementById("resultTitle").innerText =
      "You unlocked: Forever Valentine 💍💖";

    document.getElementById("finalBtn").innerText =
      "Will you be my Valentine?";

   document.getElementById("finalBtn").onclick = () => {

  launchConfetti(400);

  document.getElementById("finalMessage").innerText =
    "I love you sooo much baby mwah 💖💋";

  const overlay = document.getElementById("videoOverlay");

  overlay.classList.add("show");

};


  } else {

    document.getElementById("resultTitle").innerText =
      "Hmm… I think we need more dates 👀💕";

    document.getElementById("finalBtn").innerText = "Retry";

    document.getElementById("finalBtn").onclick =
      () => location.reload();
  }
}


/* Confetti */
const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");
canvas.width=innerWidth;
canvas.height=innerHeight;
let confetti=[];

function launchConfetti(amount){
for(let i=0;i<amount;i++){
confetti.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:5+Math.random()*6,
d:Math.random()*amount
});
}
}

function celebrate(){launchConfetti(150);}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
confetti.forEach(c=>{
ctx.fillStyle=["#ff4ca2","#ffd166","#ffffff"][Math.floor(Math.random()*3)];
ctx.fillRect(c.x,c.y,c.r,c.r);
c.y+=2;
});
requestAnimationFrame(draw);
}
draw();

/* Floating hearts */
setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerText=["💖","💗","💘"][Math.floor(Math.random()*3)];
h.style.left=Math.random()*100+"%";
h.style.fontSize=15+Math.random()*25+"px";
document.getElementById("floating").appendChild(h);
setTimeout(()=>h.remove(),8000);
},400);

</script>
<div id="videoOverlay">
  <video id="finalVideo" controls>
    <source src="cute.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
</div>


</body>
</html>
